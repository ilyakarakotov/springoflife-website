# Builds the static site and publishes it. See README "Hosting" and "Going live".
#
# INACTIVE until the repository variable SITE_AUTOMATION_ENABLED = true.
#
# Repository variables (Settings → Secrets and variables → Actions → Variables):
#   SITE_AUTOMATION_ENABLED  "true" turns this workflow (and the sync) on
#   SITE_URL                 public address, e.g. https://<owner>.github.io/springoflife-website/
#                            (default https://springoflifechurch.com). Its path becomes the base path.
#   BASE_PATH                optional; only if the base path differs from SITE_URL's path
#   PRODUCTION               "true" only for the real church site. Anything else builds a PREVIEW:
#                            every page noindex, robots.txt "Disallow: /", no sitemap.
#   DEPLOY_TARGET            "github-pages" (default) or "cloudflare"
#   CLOUDFLARE_PROJECT       Cloudflare Pages project name (DEPLOY_TARGET=cloudflare)
#   CLOUDFLARE_ACCOUNT_ID    Cloudflare account ID (DEPLOY_TARGET=cloudflare)
#   ALERT_MENTIONS           optional, e.g. "@owner1 @owner2": mentioned in the failure issue
# Secrets: CLOUDFLARE_API_TOKEN (only for DEPLOY_TARGET=cloudflare; "Cloudflare Pages: Edit").
#
# GitHub Pages needs Settings → Pages → Source = "GitHub Actions", and a public repository
# (or a paid plan for a private one).
name: Build and deploy

on:
  push:
    branches: [main]      # CMS edits and commits from a person
  workflow_dispatch:      # "Run workflow" button; also started by the sync after a data change
  schedule:
    - cron: '17 10 * * *' # daily rebuild (03:17 Pacific): date-based filtering stays fresh even if no data changed

permissions: {}           # every job asks for exactly what it needs

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    if: vars.SITE_AUTOMATION_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    env:
      SITE_URL: ${{ vars.SITE_URL || 'https://springoflifechurch.com' }}
      BASE_PATH: ${{ vars.BASE_PATH }}
      PREVIEW: ${{ vars.PRODUCTION == 'true' && 'false' || 'true' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm
      # No install scripts: sharp and esbuild ship prebuilt binaries as optional dependencies.
      - run: npm ci --ignore-scripts
      - run: npm test
      - run: npm run check          # astro check (types)
      - name: Build (${{ env.PREVIEW == 'true' && 'PREVIEW, noindex' || 'PRODUCTION' }})
        run: npm run build
      - run: npm run check:dist     # links, assets, anchors, JSON-LD, feed, noindex, no third-party loads
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: dist

  deploy-github-pages:
    needs: build
    if: vars.DEPLOY_TARGET != 'cloudflare'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write      # publish
      id-token: write   # prove to Pages that the artifact comes from this workflow
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1

  # Optional: Cloudflare Pages (private repos on a free plan, real 301 redirects from _redirects,
  # security headers from _headers). Set DEPLOY_TARGET=cloudflare plus the variables above.
  deploy-cloudflare:
    needs: build
    if: vars.DEPLOY_TARGET == 'cloudflare'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions: {}
    environment:
      name: cloudflare-pages
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: github-pages
      - name: Unpack the built site
        run: mkdir dist && tar -xf artifact.tar -C dist
      - name: Deploy with wrangler
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          PROJECT: ${{ vars.CLOUDFLARE_PROJECT }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ] || [ -z "$PROJECT" ]; then
            echo "::error::DEPLOY_TARGET=cloudflare needs the CLOUDFLARE_API_TOKEN secret and the CLOUDFLARE_ACCOUNT_ID and CLOUDFLARE_PROJECT variables."
            exit 1
          fi
          npx --yes wrangler@4.146.0 pages deploy dist --project-name "$PROJECT" --branch main --commit-dirty=true

  # A failed build or deploy opens (or comments on) one GitHub issue, so the repository's watchers
  # get an email. The next successful run closes it.
  report:
    needs: [build, deploy-github-pages, deploy-cloudflare]
    if: always() && needs.build.result != 'skipped' && needs.build.result != 'cancelled'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      issues: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      FAILED: ${{ contains(needs.*.result, 'failure') }}
      TITLE: 'Website deploy is failing'
      RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
      MENTIONS: ${{ vars.ALERT_MENTIONS }}
    steps:
      - name: Open, update or close the alert issue
        run: |
          gh label create site-alert --color B60205 --description "Automated alert from GitHub Actions" --force >/dev/null
          open=$(gh issue list --label site-alert --state open --json number,title --jq ".[] | select(.title == \"$TITLE\") | .number" | head -1)
          if [ "$FAILED" = "true" ]; then
            body="The **Build and deploy** run failed: $RUN_URL

          The site keeps serving the last successful deploy. Open the run, find the first red step, and see README \"When something fails\". Re-run with Actions → Build and deploy → Run workflow. ${MENTIONS}"
            if [ -n "$open" ]; then gh issue comment "$open" --body "$body"; else gh issue create --title "$TITLE" --label site-alert --body "$body"; fi
          elif [ -n "$open" ]; then
            gh issue close "$open" --comment "Fixed: $RUN_URL succeeded."
          fi
