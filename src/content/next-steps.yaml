# Next Steps page and the Home "Find your next step" grid.
# Each link opens an existing Planning Center form or signup. To change a link, paste the new
# Church Center address in `url`. `home: true` shows the step on the home page (keep it to 5).
steps:
  - id: baptism
    title: Get baptized
    text: Ready to proclaim your faith? Sign up to get baptized.
    url: https://springoflifechurch.churchcenter.com/registrations/events/915918
    cta: Sign up
    home: true
    image: /src/assets/photos/baptism.jpg

  - id: membership
    title: Become a member
    text: Interested in becoming a member? Start with SOL 101, our membership class.
    url: https://springoflifechurch.churchcenter.com/registrations/events/2346933
    cta: Sign up for SOL 101
    secondary_url: https://springoflifechurch.churchcenter.com/people/forms/534076
    secondary_cta: Membership form
    home: true

  - id: life-group
    title: Join a Life Group
    text: Study the Bible, pray and build friendships in a smaller group during the week.
    url: /life-groups
    cta: Find a group
    home: true

  - id: serve
    title: Serve with us
    text: Join a ministry and serve the church. Tell us where you'd like to help.
    url: https://springoflifechurch.churchcenter.com/people/forms/213642
    cta: Join a team
    home: true

  - id: prayer
    title: Ask for prayer
    text: Tell us how we can pray for you.
    url: https://springoflifechurch.churchcenter.com/people/forms/234113
    cta: Send a prayer request
    home: true

  - id: connect
    title: Fill out a connect card
    text: New here, or have a question? Tell us a little about yourself.
    url: https://springoflifechurch.churchcenter.com/people/forms/165415
    cta: Connect card

  - id: baby-dedication
    title: Dedicate your child
    text: Celebrate your new child with the church family. Dedications are on the second Sunday of each month.
    url: https://springoflifechurch.churchcenter.com/people/forms/348125
    cta: Request a dedication

  - id: engagement
    title: Share your engagement
    text: Engaged? We'd love to celebrate and pray with you. Engagements are announced on the third Sunday of each month.
    url: https://springoflifechurch.churchcenter.com/people/forms/347950
    cta: Share your news
