sunday:
  title: Join us on Sunday
  image: /src/assets/photos/sanctuary.jpg
  image_alt: The congregation listening to a sermon in the Spring of Life sanctuary
  points:
    - About 90 minutes, with traditional and contemporary worship
    - Childcare and activities for all ages
    - Come 30 minutes early and grab a coffee
    - Stay after the service for fellowship
groups:
  eyebrow: Life Groups
  title: Study the Bible, pray and build friendships in a smaller group.
  text: Fellowship is essential to your walk with Jesus. In Life Groups we build deep friendships and do life together. Find one that fits your week.
give:
  title: Why we give
  text: God is generous, and so he calls us to be as well. Everything we have has been given to us by God, and he calls us to steward it well.
